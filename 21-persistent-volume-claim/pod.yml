apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: pvc-ns
  labels:
    name: postgres
spec:
  containers:
  - image: postgres:16.1
    name: postgres
    ports:
    - containerPort: 5432
      protocol: TCP
    volumeMounts:
    - name: data
      mountPath: /var/lib/postgresql/data
    env:
    - name: POSTGRES_PASSWORD
      value: "password"
    securityContext:
      runAsUser: 70
    resources:                    # ← Added
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: postgres-pvc
    