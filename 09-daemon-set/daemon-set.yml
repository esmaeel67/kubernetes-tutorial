kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: prometheus-node-exporter
  namespace: monitoring
  labels:
    name: node-exporter
    project: prometheus
spec:
  selector:
    matchLabels:
      name: node-exporter
  template:
    metadata:
      name: node-exporter
      labels:
        name: node-exporter
    spec:
      # tolerations
      # - key: node-role.kubernetes.io/control-plane
      #   operator: Exists
      #   effect: NoSchedule
      # - key: node-role.kubernetes.io/master
      #   operator: Exists
      #   effect: NoSchedule
      # nodeSelector:
      #   gpu: enabled
      containers:
        - name: prometheus-node-exporter
          image: prom/node-exporter:latest
          ports:
          - containerPort: 9100
            protocol: TCP
            name: http