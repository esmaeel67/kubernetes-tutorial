apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: persistent-storage
  labels:
    app: postgres
spec:
  containers:
  - name: postgres
    image: postgres:15.1-alpine3.16
    ports:
    - containerPort: 5432
      protocol: TCP
    env:
    - name: POSTGRES_PASSWORD
      value: "password"
    - name: POSTGRES_USER
      value: "postgres"
    - name: POSTGRES_DB
      value: "postgres"
    volumeMounts:
    - name: data
      mountPath: /var/lib/postgresql/data
      subPath: postgres
    resources:                    # ← Added
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
 